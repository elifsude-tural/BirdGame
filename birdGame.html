<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Faz 1 — Gerçekçi Kuş Modeli</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<!-- glTF/GLB yükleyici — .glb modelleri bunsuz yüklenmez -->
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, sans-serif;
    background: #111; color: #eee;
    display: flex; height: 100vh; overflow: hidden;
  }
  #left {
    position: relative; width: 38%; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  #webcam, #overlay {
    position: absolute; width: 100%; height: 100%;
    object-fit: contain; transform: scaleX(-1);
  }
  #right { width: 62%; }
  #renderCanvas { width: 100%; height: 100%; display: block; }
  #status {
    position: absolute; top: 10px; left: 10px;
    background: rgba(0,0,0,0.6); padding: 8px 12px;
    border-radius: 8px; font-size: 13px; z-index: 10; max-width: 34vw;
  }
  #hud {
    position: absolute; bottom: 10px; left: 10px;
    background: rgba(0,0,0,0.6); padding: 8px 12px;
    border-radius: 8px; font-size: 13px; font-family: monospace; z-index: 10;
  }
</style>
</head>

<body>
  <div id="left">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="status">Yükleniyor…</div>
    <div id="hud">roll: 0.00  pitch: 0.00  flap: 0.00</div>
  </div>
  <div id="right">
    <canvas id="renderCanvas"></canvas>
  </div>

<script type="module">
import {
  PoseLandmarker, FilesetResolver, DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video   = document.getElementById("webcam");
const overlay = document.getElementById("overlay");
const octx    = overlay.getContext("2d");
const statusEl = document.getElementById("status");
const hud     = document.getElementById("hud");

// =========================================================
// 1) BABYLON — sahne, ışık, sis
// =========================================================
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
const scene  = new BABYLON.Scene(engine);

scene.clearColor = new BABYLON.Color4(0.45, 0.62, 0.42, 1);
scene.fogMode    = BABYLON.Scene.FOGMODE_EXP2;
scene.fogColor   = new BABYLON.Color3(0.45, 0.62, 0.42);
scene.fogDensity = 0.006;

const sun = new BABYLON.HemisphericLight("sun", new BABYLON.Vector3(0.3, 1, 0.2), scene);
sun.intensity = 1.0;

const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 600, height: 600 }, scene);
const gmat = new BABYLON.StandardMaterial("gmat", scene);
gmat.diffuseColor  = new BABYLON.Color3(0.30, 0.55, 0.28);
gmat.specularColor = new BABYLON.Color3(0, 0, 0);
ground.material = gmat;

const trunkMat = new BABYLON.StandardMaterial("trunkMat", scene);
trunkMat.diffuseColor = new BABYLON.Color3(0.25, 0.16, 0.10);
const leafMat = new BABYLON.StandardMaterial("leafMat", scene);
leafMat.diffuseColor  = new BABYLON.Color3(0.10, 0.22, 0.30);
leafMat.specularColor = new BABYLON.Color3(0, 0, 0);
function makeTree(x, z) {
  const trunk = BABYLON.MeshBuilder.CreateCylinder("t", { height: 3, diameter: 0.5 }, scene);
  trunk.material = trunkMat; trunk.position.set(x, 1.5, z);
  const leaves = BABYLON.MeshBuilder.CreateSphere("l", { diameter: 3.5, segments: 6 }, scene);
  leaves.material = leafMat; leaves.position.set(x, 3.8, z);
}
for (let i = 0; i < 120; i++) makeTree((Math.random() - 0.5) * 500, (Math.random() - 0.5) * 500);

// =========================================================
// 2) KUŞ — önce basit kuşu kur, GLB gelirse üstüne geç
// =========================================================
const bird = new BABYLON.TransformNode("bird", scene); // flight bunu hareket ettirir
bird.position.set(0, 25, 0);

// GLB modelini içine koyacağımız ara düğüm (ölçek/yön ayarı burada)
const modelHolder = new BABYLON.TransformNode("modelHolder", scene);
modelHolder.parent = bird;

// applyFlap: çırpma gücünü kuşun kanadına uygular.
// Başta basit-kuş sürümü; GLB yüklenirse animasyon sürümüyle değişir.
let applyFlap = () => {};
let proceduralParts = null;

function buildProceduralBird() {
  const bodyMat = new BABYLON.StandardMaterial("bodyMat", scene);
  bodyMat.diffuseColor = new BABYLON.Color3(0.75, 0.25, 0.65);
  const wingMat = new BABYLON.StandardMaterial("wingMat", scene);
  wingMat.diffuseColor = new BABYLON.Color3(0.55, 0.85, 0.45);

  const body = BABYLON.MeshBuilder.CreateSphere("body", { diameterX: 0.8, diameterY: 0.5, diameterZ: 1.8 }, scene);
  body.material = bodyMat; body.parent = modelHolder;
  const head = BABYLON.MeshBuilder.CreateSphere("head", { diameter: 0.5 }, scene);
  head.material = bodyMat; head.position.set(0, 0.15, 1.0); head.parent = modelHolder;

  const lw = BABYLON.MeshBuilder.CreateBox("lw", { width: 1.6, height: 0.06, depth: 0.9 }, scene);
  lw.material = wingMat; lw.parent = modelHolder; lw.position.x = -0.9;
  lw.setPivotPoint(new BABYLON.Vector3(0.8, 0, 0));
  const rw = BABYLON.MeshBuilder.CreateBox("rw", { width: 1.6, height: 0.06, depth: 0.9 }, scene);
  rw.material = wingMat; rw.parent = modelHolder; rw.position.x = 0.9;
  rw.setPivotPoint(new BABYLON.Vector3(-0.8, 0, 0));

  const meshes = [body, head, lw, rw];
  proceduralParts = { meshes, lw, rw };

  // Çırpma sadece flapPower > 0 iken: genlik güce bağlı, güç 0 -> kanat düz
  let t = 0;
  applyFlap = (flapPower, dt) => {
    t += dt * 12;
    const amp = flapPower * 0.8;
    const a = Math.sin(t) * amp;
    lw.rotation.z =  a;
    rw.rotation.z = -a;
  };
}
buildProceduralBird(); // her zaman bir kuş olsun (yapıştır-çalış)

// --- GLB yüklemeyi dene: yanına bird.glb koyduysan gerçekçi modele geçer ---
const MODEL_SCALE = 0.02;   // model çok büyük/küçükse ayarla (ör. 0.05 veya 10)
const MODEL_ROT_Y = 0;    // burnu yanlış yöne bakıyorsa: Math.PI (180°) dene
const FLAP_ANIM_SPEED = 3; // çırpınca gömülü animasyon ne hızda oynar

BABYLON.SceneLoader.ImportMeshAsync(null, "./", "bird.glb", scene).then((res) => {
  // Basit kuşu kaldır
  if (proceduralParts) proceduralParts.meshes.forEach(m => m.dispose());

  const root = res.meshes[0];
  root.parent = modelHolder;
  modelHolder.scaling.setAll(MODEL_SCALE);
  modelHolder.rotation.y = MODEL_ROT_Y;
  

  // Gömülü kanat animasyonunu bul (isimde fly/flap/wing geçen; yoksa ilki)
  const groups = res.animationGroups || [];
  let flapGroup = groups.find(g => /fly|flap|wing/i.test(g.name)) || groups[0];

  if (flapGroup) {
    flapGroup.start(true);          // döngüde başlat
    flapGroup.speedRatio = 0;       // ama dururken çırpmasın
    applyFlap = (flapPower) => {
      // çırpma gücü -> animasyon hızı. Güç 0 -> animasyon donar (süzülme).
      flapGroup.speedRatio = flapPower * FLAP_ANIM_SPEED;
    };
    statusEl.textContent = "Gerçekçi model yüklendi! Kollarını çırp → kuş çırpar.";
  } else {
    // Model var ama animasyonu yok: en azından görünsün
    applyFlap = () => {};
    statusEl.textContent = "Model yüklendi (animasyonsuz).";
  }
}).catch(() => {
  // bird.glb yok/bozuk -> basit kuşla devam (sorun değil)
  statusEl.textContent = "Uçuyorsun! (bird.glb eklersen gerçekçi kuşa geçer)";
});

// =========================================================
// 3) TAKİP KAMERASI
// =========================================================
const camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 30, -12), scene);
const CAM_DIST = 12, CAM_HEIGHT = 4;

// =========================================================
// 4) UÇUŞ DURUMU
// =========================================================
let heading = 0;
let smoothRoll = 0, smoothPitch = 0;
let targetRoll = 0, targetPitch = 0;

let prevWristY = null, lastPoseTime = performance.now();
let flapRaw = 0, flapPower = 0;

const SPEED      = 14;
const TURN_RATE  = 1.4;
const CLIMB_RATE = 10;
const MAX_ROLL   = 0.55;
const MAX_PITCH  = 0.5;
const ROLL_GAIN  = 2.8;
const PITCH_GAIN = 2.8;
const DEADZONE   = 0.04;

// Çırpma uçuşa da yansısın (istemezsen ikisini 0 yap, sadece görsel çırpar):
const FLAP_SENS   = 0.5;
const FLAP_THRUST = 12;
const FLAP_LIFT   = 6;

function lerp(a, b, t)  { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function deadzone(v, d) { return Math.abs(v) < d ? 0 : v; }

// =========================================================
// 5) MEDIAPIPE + WEBCAM
// =========================================================
let poseLandmarker, drawingUtils, lastVideoTime = -1;

async function initPose() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO", numPoses: 1
  });
  drawingUtils = new DrawingUtils(octx);
  startWebcam();
}

async function startWebcam() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  video.srcObject = stream;
  video.addEventListener("loadeddata", () => {
    overlay.width  = video.videoWidth;
    overlay.height = video.videoHeight;
    detectLoop();
  });
}

function detectLoop() {
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    poseLandmarker.detectForVideo(video, performance.now(), (result) => {
      octx.save();
      octx.clearRect(0, 0, overlay.width, overlay.height);
      if (result.landmarks && result.landmarks.length > 0) {
        const lm = result.landmarks[0];
        drawingUtils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: "#38bdf8", lineWidth: 3 });
        drawingUtils.drawLandmarks(lm, { color: "#fbbf24", radius: 4 });
        readPose(lm);
      } else {
        targetRoll = 0; targetPitch = 0; flapRaw = 0; prevWristY = null;
      }
      octx.restore();
    });
  }
  requestAnimationFrame(detectLoop);
}

function readPose(lm) {
  const ls = lm[11], rs = lm[12];
  const lw = lm[15], rw = lm[16];

  const shoulderY = (ls.y + rs.y) / 2;
  const wristY    = (lw.y + rw.y) / 2;

  targetRoll  = clamp(deadzone((rw.y - lw.y) * ROLL_GAIN, DEADZONE), -MAX_ROLL, MAX_ROLL);
  targetPitch = clamp(deadzone((shoulderY - wristY) * PITCH_GAIN, DEADZONE), -MAX_PITCH, MAX_PITCH);

  // Çırpma: bileklerin dikey HIZI (sadece kolların hareket edince > 0)
  const now = performance.now();
  const dtp = (now - lastPoseTime) / 1000;
  lastPoseTime = now;
  if (prevWristY !== null && dtp > 0.001 && dtp < 0.5) {
    flapRaw = Math.abs(wristY - prevWristY) / dtp;
  }
  prevWristY = wristY;
}

// =========================================================
// 6) RENDER DÖNGÜSÜ
// =========================================================
scene.onBeforeRenderObservable.add(() => {
  const dt = engine.getDeltaTime() / 1000;

  smoothRoll  = lerp(smoothRoll,  targetRoll,  0.12);
  smoothPitch = lerp(smoothPitch, targetPitch, 0.12);
  flapPower   = lerp(flapPower, clamp(flapRaw * FLAP_SENS, 0, 1), 0.15);

  heading += smoothRoll * TURN_RATE * dt;

  const speedNow = SPEED + flapPower * FLAP_THRUST;
  const fwd = new BABYLON.Vector3(Math.sin(heading), 0, Math.cos(heading));
  bird.position.addInPlace(fwd.scale(speedNow * dt));
  bird.position.y += smoothPitch * CLIMB_RATE * dt;
  bird.position.y += flapPower * FLAP_LIFT * dt;
  bird.position.y = Math.max(3, bird.position.y);

  bird.rotation.y = heading;
  bird.rotation.x = -smoothPitch;
  bird.rotation.z = -smoothRoll;

  // Kanat çırpma (basit kuş ya da GLB, hangisi yüklüyse)
  applyFlap(flapPower, dt);

  const camPos = bird.position.subtract(fwd.scale(CAM_DIST));
  camPos.y += CAM_HEIGHT;
  camera.position = BABYLON.Vector3.Lerp(camera.position, camPos, 0.1);
  camera.setTarget(bird.position.add(new BABYLON.Vector3(0, 1, 0)));

  hud.textContent = `roll: ${smoothRoll.toFixed(2)}  pitch: ${smoothPitch.toFixed(2)}  flap: ${flapPower.toFixed(2)}`;
});

engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());

statusEl.textContent = "MediaPipe yükleniyor…";
initPose().catch((e) => { statusEl.textContent = "Hata: " + e.message; console.error(e); });
</script>
</body>
</html>
