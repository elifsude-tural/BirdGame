<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Faz 2 — Hedef Toplama</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
    display: flex; height: 100vh; overflow: hidden; }
  #left { position: relative; width: 38%; background: #000;
    display: flex; align-items: center; justify-content: center; }
  #webcam, #overlay { position: absolute; width: 100%; height: 100%;
    object-fit: contain; transform: scaleX(-1); }
  #right { position: relative; width: 62%; }
  #renderCanvas { width: 100%; height: 100%; display: block; }
  #status { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; z-index: 10; max-width: 34vw; }
  #hud { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; font-family: monospace; z-index: 10; }

  /* --- OYUN ARAYÜZÜ (sağ panel üstünde) --- */
  #gameHud { position: absolute; top: 12px; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: center; gap: 14px; pointer-events: none; }
  #score, #timer { background: rgba(0,0,0,0.55); padding: 6px 16px; border-radius: 20px;
    font-size: 18px; font-weight: 600; }
  #score { color: #ffd54a; }
  #compass { position: absolute; top: 66px; left: 50%; transform: translateX(-50%);
    z-index: 10; text-align: center; pointer-events: none; }
  #arrow { font-size: 42px; color: #ffd54a; line-height: 1;
    text-shadow: 0 0 8px rgba(0,0,0,0.7); transition: transform 0.08s linear; }
  #dist { display: inline-block; margin-top: 2px; font-size: 15px;
    background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 10px; }
  #win { position: absolute; inset: 0; z-index: 20; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); text-align: center; }
  #win h1 { font-size: 40px; margin: 0 0 8px; color: #ffd54a; }
  #win p { font-size: 22px; margin: 0; }
  #replayBtn { margin-top: 22px; padding: 12px 28px; font-size: 18px; font-weight: 600;
    color: #111; background: #ffd54a; border: none; border-radius: 24px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4); transition: transform 0.08s, background 0.15s; }
  #replayBtn:hover { background: #ffe27a; transform: translateY(-2px); }
  #replayBtn:active { transform: translateY(0); }
</style>
</head>

<body>
  <div id="left">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div id="status">Yükleniyor…</div>
    <div id="hud">roll: 0.00  pitch: 0.00  flap: 0.00</div>
  </div>
  <div id="right">
    <canvas id="renderCanvas"></canvas>
    <div id="gameHud">
      <div id="score">0 / 3</div>
      <div id="timer">00:00</div>
    </div>
    <div id="compass">
      <div id="arrow">▲</div>
      <div id="dist">--</div>
    </div>
    <div id="win">
      <h1>Tebrikler!</h1>
      <p id="winText"></p>
      <button id="replayBtn">Tekrar Oyna</button>
    </div>
  </div>

<script type="module">
import {
  PoseLandmarker, FilesetResolver, DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video   = document.getElementById("webcam");
const overlay = document.getElementById("overlay");
const octx    = overlay.getContext("2d");
const statusEl = document.getElementById("status");
const hud     = document.getElementById("hud");
const scoreEl = document.getElementById("score");
const timerEl = document.getElementById("timer");
const arrowEl = document.getElementById("arrow");
const distEl  = document.getElementById("dist");
const winEl   = document.getElementById("win");
const winText = document.getElementById("winText");
const replayBtn = document.getElementById("replayBtn");
const compassEl = document.getElementById("compass");

const WORLD_LIMIT = 280;

// =========================================================
// 1) BABYLON — sahne, ışık, sis
// =========================================================
const canvas = document.getElementById("renderCanvas");
const engine = new BABYLON.Engine(canvas, true);
const scene  = new BABYLON.Scene(engine);

scene.clearColor = new BABYLON.Color4(0.55, 0.72, 0.55, 1);
scene.fogMode    = BABYLON.Scene.FOGMODE_EXP2;
scene.fogColor   = new BABYLON.Color3(0.55, 0.72, 0.55);
scene.fogDensity = 0.005;

const sun = new BABYLON.HemisphericLight("sun", new BABYLON.Vector3(0.3, 1, 0.2), scene);
sun.intensity = 1.05;

// Parlama efekti (küreler ışıldasın)
const glow = new BABYLON.GlowLayer("glow", scene);
glow.intensity = 0.9;

// --- ÇİM DOKUSU ---
function makeGrassTexture() {
  const size = 256;
  const tex = new BABYLON.DynamicTexture("grass", size, scene, false);
  const c = tex.getContext();
  c.fillStyle = "#3f7a37"; c.fillRect(0, 0, size, size);
  const greens = ["#356b2e", "#478a3b", "#2f5f28", "#54984a", "#3c7534"];
  for (let i = 0; i < 3500; i++) {
    c.strokeStyle = greens[(Math.random() * greens.length) | 0];
    c.lineWidth = 1 + Math.random() * 1.5;
    const x = Math.random() * size, y = Math.random() * size;
    const len = 2 + Math.random() * 4;
    c.beginPath(); c.moveTo(x, y);
    c.lineTo(x + (Math.random() - 0.5) * 2, y - len); c.stroke();
  }
  tex.update();
  tex.wrapU = tex.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
  tex.uScale = tex.vScale = 80;
  return tex;
}
const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 600, height: 600 }, scene);
const gmat = new BABYLON.StandardMaterial("gmat", scene);
gmat.diffuseTexture = makeGrassTexture();
gmat.specularColor  = new BABYLON.Color3(0, 0, 0);
ground.material = gmat;

// --- DOĞAL AĞAÇLAR (jitter'lı ızgara) ---
const treePositions = [];
const CELL = 42, JITTER = 0.85, SKIP = 0.18;
for (let gx = -WORLD_LIMIT; gx < WORLD_LIMIT; gx += CELL) {
  for (let gz = -WORLD_LIMIT; gz < WORLD_LIMIT; gz += CELL) {
    if (Math.random() < SKIP) continue;
    const x = gx + CELL / 2 + (Math.random() - 0.5) * CELL * JITTER;
    const z = gz + CELL / 2 + (Math.random() - 0.5) * CELL * JITTER;
    if (Math.abs(x) > WORLD_LIMIT || Math.abs(z) > WORLD_LIMIT) continue;
    treePositions.push({ x, z });
  }
}
const trunkMat = new BABYLON.StandardMaterial("trunkMat", scene);
trunkMat.diffuseColor = new BABYLON.Color3(0.25, 0.16, 0.10);
const leafMat = new BABYLON.StandardMaterial("leafMat", scene);
leafMat.diffuseColor  = new BABYLON.Color3(0.12, 0.30, 0.16);
leafMat.specularColor = new BABYLON.Color3(0, 0, 0);
let proceduralTrees = [];
treePositions.forEach(p => {
  const trunk = BABYLON.MeshBuilder.CreateCylinder("t", { height: 3, diameter: 0.5 }, scene);
  trunk.material = trunkMat; trunk.position.set(p.x, 1.5, p.z);
  const leaves = BABYLON.MeshBuilder.CreateSphere("l", { diameter: 3.5, segments: 6 }, scene);
  leaves.material = leafMat; leaves.position.set(p.x, 3.8, p.z);
  proceduralTrees.push(trunk, leaves);
});
const TREE_SCALE = 3, TREE_ROT_X = 0;
BABYLON.SceneLoader.ImportMeshAsync(null, "./", "tree.glb", scene).then((res) => {
  proceduralTrees.forEach(m => m.dispose());
  const root = res.meshes[0]; root.setEnabled(false);
  treePositions.forEach((p, i) => {
    const holder = new BABYLON.TransformNode("th" + i, scene);
    holder.position.set(p.x, 0, p.z);
    holder.scaling.setAll(TREE_SCALE * (0.7 + Math.random() * 0.6));
    holder.rotation = new BABYLON.Vector3(TREE_ROT_X, Math.random() * Math.PI * 2, 0);
    const t = root.clone("tree" + i);
    t.setEnabled(true); t.parent = holder; t.position.set(0, 0, 0);
  });
}).catch(() => {});

// =========================================================
// 1.5) HEDEFLER — parlayan küreler
// =========================================================
const TOTAL_TARGETS  = 15;   // sahnedeki küre sayısı (aynı kalıyor)
const TARGET_GOAL    = 3;    // kazanmak için toplanacak küre
const COLLECT_RADIUS = 6;
const orbs = [];

const orbMat = new BABYLON.StandardMaterial("orbMat", scene);
orbMat.emissiveColor = new BABYLON.Color3(1.0, 0.82, 0.15); // altın sarısı ışıma
orbMat.diffuseColor  = new BABYLON.Color3(1.0, 0.82, 0.15);
orbMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);

function randomOrbPos() {
  return {
    x: (Math.random() - 0.5) * 2 * (WORLD_LIMIT - 25),
    z: (Math.random() - 0.5) * 2 * (WORLD_LIMIT - 25),
    y: 8 + Math.random() * 24
  };
}

for (let i = 0; i < TOTAL_TARGETS; i++) {
  const m = BABYLON.MeshBuilder.CreateSphere("orb" + i, { diameter: 3, segments: 12 }, scene);
  m.material = orbMat;
  const p = randomOrbPos();
  m.position.set(p.x, p.y, p.z);
  orbs.push({ mesh: m, baseY: p.y, phase: Math.random() * Math.PI * 2,
              collected: false, collecting: false, collectT: 0 });
}

let collectedCount = 0;

// Toplama sesi (kod içinde, dosya yok)
let audioCtx = null;
function blip() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(660, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(1320, audioCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.25, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.18);
  } catch (e) {}
}
document.addEventListener("click", () => { if (audioCtx && audioCtx.state === "suspended") audioCtx.resume(); });

// =========================================================
// 2) KUŞ
// =========================================================
const bird = new BABYLON.TransformNode("bird", scene);
bird.position.set(0, 25, 0);
const modelHolder = new BABYLON.TransformNode("modelHolder", scene);
modelHolder.parent = bird;

let applyFlap = () => {};
let proceduralParts = null;

function buildProceduralBird() {
  const bodyMat = new BABYLON.StandardMaterial("bodyMat", scene);
  bodyMat.diffuseColor = new BABYLON.Color3(0.75, 0.25, 0.65);
  const wingMat = new BABYLON.StandardMaterial("wingMat", scene);
  wingMat.diffuseColor = new BABYLON.Color3(0.55, 0.85, 0.45);
  const body = BABYLON.MeshBuilder.CreateSphere("body", { diameterX: 0.8, diameterY: 0.5, diameterZ: 1.8 }, scene);
  body.material = bodyMat; body.parent = modelHolder;
  const head = BABYLON.MeshBuilder.CreateSphere("head", { diameter: 0.5 }, scene);
  head.material = bodyMat; head.position.set(0, 0.15, 1.0); head.parent = modelHolder;
  const lw = BABYLON.MeshBuilder.CreateBox("lw", { width: 1.6, height: 0.06, depth: 0.9 }, scene);
  lw.material = wingMat; lw.parent = modelHolder; lw.position.x = -0.9;
  lw.setPivotPoint(new BABYLON.Vector3(0.8, 0, 0));
  const rw = BABYLON.MeshBuilder.CreateBox("rw", { width: 1.6, height: 0.06, depth: 0.9 }, scene);
  rw.material = wingMat; rw.parent = modelHolder; rw.position.x = 0.9;
  rw.setPivotPoint(new BABYLON.Vector3(-0.8, 0, 0));
  proceduralParts = { meshes: [body, head, lw, rw] };
  let t = 0;
  applyFlap = (flapPower, dt) => {
    t += dt * 12; const a = Math.sin(t) * flapPower * 0.8;
    lw.rotation.z = a; rw.rotation.z = -a;
  };
}
buildProceduralBird();

const MODEL_SCALE = 0.02;   // sende çalışan ölçek
const MODEL_ROT_Y = 0;      // <-- flamingonun DÜZ baktığı değerini buraya yaz
const FLAP_ANIM_SPEED = 3;

BABYLON.SceneLoader.ImportMeshAsync(null, "./", "bird.glb", scene).then((res) => {
  if (proceduralParts) proceduralParts.meshes.forEach(m => m.dispose());
  const root = res.meshes[0];
  root.parent = modelHolder;
  modelHolder.scaling.setAll(MODEL_SCALE);
  modelHolder.rotation.y = MODEL_ROT_Y;
  const groups = res.animationGroups || [];
  let flapGroup = groups.find(g => /fly|flap|wing/i.test(g.name)) || groups[0];
  if (flapGroup) {
    flapGroup.start(true); flapGroup.speedRatio = 0;
    applyFlap = (flapPower) => { flapGroup.speedRatio = flapPower * FLAP_ANIM_SPEED; };
    statusEl.textContent = "Küreleri topla! Kollarını çırp → hızlan.";
  } else {
    applyFlap = () => {};
    statusEl.textContent = "Model yüklendi (animasyonsuz).";
  }
}).catch(() => {
  statusEl.textContent = "Küreleri topla! (bird.glb eklersen gerçekçi kuşa geçer)";
});

// =========================================================
// 3) TAKİP KAMERASI
// =========================================================
const camera = new BABYLON.UniversalCamera("cam", new BABYLON.Vector3(0, 30, -12), scene);
const CAM_DIST = 12, CAM_HEIGHT = 4;

// =========================================================
// 4) UÇUŞ DURUMU
// =========================================================
let heading = 0;
let smoothRoll = 0, smoothPitch = 0;
let targetRoll = 0, targetPitch = 0;
let prevWristY = null, lastPoseTime = performance.now();
let flapRaw = 0, flapPower = 0;

const SPEED = 14, TURN_RATE = 1.4, CLIMB_RATE = 10;
const MAX_ROLL = 0.55, MAX_PITCH = 0.5;
const ROLL_GAIN = 2.8, PITCH_GAIN = 2.8, DEADZONE = 0.04;
const FLAP_SENS = 0.5, FLAP_THRUST = 12, FLAP_LIFT = 6;
const SOFT_EDGE = 210, EDGE_TURN = 2.5;

let gameStart = null, finished = false, worldTime = 0;

function lerp(a, b, t)  { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function deadzone(v, d) { return Math.abs(v) < d ? 0 : v; }
function turnToward(cur, target, maxStep) {
  let diff = target - cur;
  while (diff >  Math.PI) diff -= 2 * Math.PI;
  while (diff < -Math.PI) diff += 2 * Math.PI;
  return cur + clamp(diff, -maxStep, maxStep);
}
function fmt(ms) {
  const s = Math.floor(ms / 1000);
  return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
}

// =========================================================
// 4.5) OYUNU SIFIRLA (Tekrar Oyna)
// =========================================================
function resetGame() {
  // kuş başa dönsün
  bird.position.set(0, 25, 0);
  bird.rotation.set(0, 0, 0);
  heading = 0;
  smoothRoll = smoothPitch = 0;
  targetRoll = targetPitch = 0;
  flapRaw = flapPower = 0;
  prevWristY = null;

  // küreler yeniden yerleşsin
  for (const orb of orbs) {
    orb.collected = false;
    orb.collecting = false;
    orb.collectT = 0;
    const p = randomOrbPos();
    orb.baseY = p.y;
    orb.phase = Math.random() * Math.PI * 2;
    orb.mesh.position.set(p.x, p.y, p.z);
    orb.mesh.rotation.y = 0;
    orb.mesh.scaling.setAll(1);
    orb.mesh.setEnabled(true);
  }

  // durum
  collectedCount = 0;
  finished = false;
  scoreEl.textContent = "0 / " + TARGET_GOAL;
  timerEl.textContent = "00:00";
  compassEl.style.display = "";     // pusula tekrar görünsün
  winEl.style.display = "none";     // kazanma ekranını kapat
  gameStart = performance.now();    // süre baştan
}
replayBtn.addEventListener("click", resetGame);

// =========================================================
// 5) MEDIAPIPE + WEBCAM
// =========================================================
let poseLandmarker, drawingUtils, lastVideoTime = -1;

async function initPose() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO", numPoses: 1
  });
  drawingUtils = new DrawingUtils(octx);
  startWebcam();
}
async function startWebcam() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  video.srcObject = stream;
  video.addEventListener("loadeddata", () => {
    overlay.width  = video.videoWidth;
    overlay.height = video.videoHeight;
    gameStart = performance.now(); // süre başlasın
    detectLoop();
  });
}
function detectLoop() {
  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    poseLandmarker.detectForVideo(video, performance.now(), (result) => {
      octx.save(); octx.clearRect(0, 0, overlay.width, overlay.height);
      if (result.landmarks && result.landmarks.length > 0) {
        const lm = result.landmarks[0];
        drawingUtils.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, { color: "#38bdf8", lineWidth: 3 });
        drawingUtils.drawLandmarks(lm, { color: "#fbbf24", radius: 4 });
        readPose(lm);
      } else { targetRoll = 0; targetPitch = 0; flapRaw = 0; prevWristY = null; }
      octx.restore();
    });
  }
  requestAnimationFrame(detectLoop);
}
function readPose(lm) {
  const ls = lm[11], rs = lm[12], lw = lm[15], rw = lm[16];
  const shoulderY = (ls.y + rs.y) / 2;
  const wristY    = (lw.y + rw.y) / 2;
  targetRoll  = clamp(deadzone((rw.y - lw.y) * ROLL_GAIN, DEADZONE), -MAX_ROLL, MAX_ROLL);
  targetPitch = clamp(deadzone((shoulderY - wristY) * PITCH_GAIN, DEADZONE), -MAX_PITCH, MAX_PITCH);
  const now = performance.now();
  const dtp = (now - lastPoseTime) / 1000; lastPoseTime = now;
  if (prevWristY !== null && dtp > 0.001 && dtp < 0.5) flapRaw = Math.abs(wristY - prevWristY) / dtp;
  prevWristY = wristY;
}

// =========================================================
// 6) RENDER DÖNGÜSÜ
// =========================================================
scene.onBeforeRenderObservable.add(() => {
  const dt = engine.getDeltaTime() / 1000;
  worldTime += dt;

  // Oyun bitti → kuş donsun, sahne olduğu yerde kalsın.
  if (finished) return;

  // --- uçuş ---
  smoothRoll  = lerp(smoothRoll,  targetRoll,  0.12);
  smoothPitch = lerp(smoothPitch, targetPitch, 0.12);
  flapPower   = lerp(flapPower, clamp(flapRaw * FLAP_SENS, 0, 1), 0.15);
  heading += smoothRoll * TURN_RATE * dt;

  const speedNow = SPEED + flapPower * FLAP_THRUST;
  const fwd = new BABYLON.Vector3(Math.sin(heading), 0, Math.cos(heading));
  bird.position.addInPlace(fwd.scale(speedNow * dt));
  bird.position.y += smoothPitch * CLIMB_RATE * dt;
  bird.position.y += flapPower * FLAP_LIFT * dt;
  bird.position.y = Math.max(3, bird.position.y);

  const bx = bird.position.x, bz = bird.position.z;
  const distC = Math.sqrt(bx * bx + bz * bz);
  if (distC > SOFT_EDGE) {
    const angleToCenter = Math.atan2(-bx, -bz);
    const strength = clamp((distC - SOFT_EDGE) / (WORLD_LIMIT - SOFT_EDGE), 0, 1);
    heading = turnToward(heading, angleToCenter, EDGE_TURN * strength * dt);
  }
  bird.position.x = clamp(bird.position.x, -WORLD_LIMIT, WORLD_LIMIT);
  bird.position.z = clamp(bird.position.z, -WORLD_LIMIT, WORLD_LIMIT);

  bird.rotation.y = heading;
  bird.rotation.x = -smoothPitch;
  bird.rotation.z = -smoothRoll;
  applyFlap(flapPower, dt);

  // --- HEDEFLER: animasyon + toplama + en yakını bul (pusula için) ---
  let nearest = null, nearestDist = Infinity;
  for (const orb of orbs) {
    if (orb.collected && !orb.collecting) continue;

    if (orb.collecting) {
      // toplanınca büyüyüp kaybolma efekti
      orb.collectT += dt;
      orb.mesh.scaling.setAll(1 + orb.collectT * 7);
      if (orb.collectT > 0.2) { orb.mesh.setEnabled(false); orb.collecting = false; }
      continue;
    }

    // sekme + dönme
    orb.mesh.position.y = orb.baseY + Math.sin(worldTime * 2 + orb.phase) * 0.8;
    orb.mesh.rotation.y += dt * 1.5;

    // toplama kontrolü
    const d = BABYLON.Vector3.Distance(bird.position, orb.mesh.position);
    if (d < COLLECT_RADIUS) {
      orb.collected = true; orb.collecting = true; orb.collectT = 0;
      collectedCount++;
      scoreEl.textContent = collectedCount + " / " + TARGET_GOAL;
      blip();
      if (collectedCount >= TARGET_GOAL && !finished) {
        finished = true;
        winText.textContent = TARGET_GOAL + " / " + TARGET_GOAL + " küre — Süre: " + fmt(performance.now() - gameStart);
        winEl.style.display = "flex";
      }
      continue;
    }

    // pusula için en yakın (yatay mesafe)
    const dx = orb.mesh.position.x - bird.position.x;
    const dz = orb.mesh.position.z - bird.position.z;
    const horiz = Math.sqrt(dx * dx + dz * dz);
    if (horiz < nearestDist) { nearestDist = horiz; nearest = orb; }
  }

  // --- PUSULA OKU ---
  if (nearest) {
    const dx = nearest.mesh.position.x - bird.position.x;
    const dz = nearest.mesh.position.z - bird.position.z;
    const angleToTarget = Math.atan2(dx, dz);
    let rel = angleToTarget - heading;
    while (rel >  Math.PI) rel -= 2 * Math.PI;
    while (rel < -Math.PI) rel += 2 * Math.PI;
    arrowEl.style.transform = "rotate(" + (rel * 180 / Math.PI) + "deg)";
    // yön ters gelirse: yukarıdaki satırı (-rel * 180 / Math.PI) yap
    const d3 = BABYLON.Vector3.Distance(bird.position, nearest.mesh.position);
    distEl.textContent = Math.round(d3) + "m";
  } else {
    compassEl.style.display = "none";
  }

  // --- süre ---
  if (gameStart && !finished) timerEl.textContent = fmt(performance.now() - gameStart);

  // --- kamera ---
  const camPos = bird.position.subtract(fwd.scale(CAM_DIST));
  camPos.y += CAM_HEIGHT;
  camera.position = BABYLON.Vector3.Lerp(camera.position, camPos, 0.1);
  camera.setTarget(bird.position.add(new BABYLON.Vector3(0, 1, 0)));

  hud.textContent = `roll: ${smoothRoll.toFixed(2)}  pitch: ${smoothPitch.toFixed(2)}  flap: ${flapPower.toFixed(2)}`;
});

engine.runRenderLoop(() => scene.render());
window.addEventListener("resize", () => engine.resize());

statusEl.textContent = "MediaPipe yükleniyor…";
initPose().catch((e) => { statusEl.textContent = "Hata: " + e.message; console.error(e); });
</script>
</body>
</html>
